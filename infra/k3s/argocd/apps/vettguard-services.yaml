# VettGuard application services. ArgoCD recurses through
# infra/k3s/helm/vettguard/ and applies every *.yaml it finds. Each
# subdirectory ships a Deployment + Service (+ Ingress for the four
# public surfaces). Namespace is created via base/namespace.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vettguard-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/vettguard/vettguard.git
    targetRevision: HEAD
    path: infra/k3s/helm/vettguard
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: vettguard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
