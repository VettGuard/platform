# App-of-apps root. Points to the apps/ directory; ArgoCD recursively
# materializes every Application manifest it finds there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vettguard-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/vettguard/vettguard.git
    targetRevision: HEAD
    path: infra/k3s/argocd/apps
    directory:
      recurse: true
      include: "*.yaml"
      exclude: "root.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff: { duration: 5s, factor: 2, maxDuration: 3m }
