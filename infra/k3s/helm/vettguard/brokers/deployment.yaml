apiVersion: apps/v1
kind: Deployment
metadata:
  name: brokers
  namespace: vettguard
  labels: { app: brokers }
spec:
  replicas: 1
  selector: { matchLabels: { app: brokers } }
  template:
    metadata:
      labels: { app: brokers }
    spec:
      containers:
        - name: brokers
          image: ghcr.io/vettguard/brokers:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
          env:
            - { name: HTTP_PORT,   value: "8086" }
            - { name: ENVIRONMENT, value: "staging" }
            - { name: LOG_LEVEL,   value: "info" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability:4317" }
            # Cluster-internal AI gateway URL — Vet calls
            # /v1/ai/score-broker; falls back to FNV-1a mock on unreachable.
            - { name: AI_GATEWAY_URL, value: "http://ai-gateway.vettguard.svc.cluster.local:8090" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: brokers-env, key: DATABASE_URL } }
          envFrom:
            - secretRef: { name: brokers-env, optional: true }
          readinessProbe:
            httpGet: { path: /v1/brokers/info, port: 8086 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
