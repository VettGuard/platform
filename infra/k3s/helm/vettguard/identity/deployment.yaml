apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: vettguard
  labels: { app: identity }
spec:
  replicas: 1
  selector: { matchLabels: { app: identity } }
  template:
    metadata:
      labels: { app: identity }
    spec:
      containers:
        - name: identity
          image: ghcr.io/vettguard/identity:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - { name: HTTP_PORT,   value: "8081" }
            - { name: ENVIRONMENT, value: "staging" }
            - { name: LOG_LEVEL,   value: "info" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability:4317" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: identity-env, key: DATABASE_URL } }
          envFrom:
            - secretRef: { name: identity-env, optional: true }
          readinessProbe:
            httpGet: { path: /v1/identity/info, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
