apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: vettguard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [api.vettguard.com]
      secretName: gateway-tls
  rules:
    - host: api.vettguard.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { number: 8080 }
