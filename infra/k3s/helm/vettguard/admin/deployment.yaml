apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: vettguard
  labels: { app: admin }
spec:
  replicas: 1
  selector: { matchLabels: { app: admin } }
  template:
    metadata:
      labels: { app: admin }
    spec:
      containers:
        - name: admin
          image: ghcr.io/vettguard/admin:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 3002 }]
          env:
            - { name: NODE_ENV, value: "production" }
            - { name: PORT, value: "3002" }
            - { name: HOSTNAME, value: "0.0.0.0" }
            - { name: NEXT_PUBLIC_GATEWAY_URL, value: "https://api.vettguard.com" }
          envFrom:
            - secretRef: { name: admin-env, optional: true }
          readinessProbe:
            httpGet: { path: /, port: 3002 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 384Mi }
