apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  namespace: vettguard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [admin.vettguard.com]
      secretName: admin-tls
  rules:
    - host: admin.vettguard.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port: { number: 3002 }
