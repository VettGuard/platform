apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landing
  namespace: vettguard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [vettguard.com]
      secretName: landing-tls
  rules:
    - host: vettguard.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: landing
                port: { number: 3000 }
