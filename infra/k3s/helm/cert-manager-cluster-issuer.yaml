# Apply after cert-manager Helm chart is healthy.
# Cloudflare API token must be sealed first:
#   kubectl create secret generic cf-api-token \
#     --from-literal=token=$CLOUDFLARE_TOKEN \
#     -n cert-manager --dry-run=client -o yaml \
#     | kubeseal --controller-namespace=kube-system -o yaml \
#     > cluster-issuer-secret.sealed.yaml
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@vettguard.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            email: ops@vettguard.com
            apiTokenSecretRef:
              name: cf-api-token
              key: token
        selector:
          dnsZones: ["vettguard.com"]
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ops@vettguard.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            email: ops@vettguard.com
            apiTokenSecretRef:
              name: cf-api-token
              key: token
        selector:
          dnsZones: ["vettguard.com"]
