version: v2
clean: true
plugins:
  # Go message types
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative
  # Go Connect-RPC service stubs
  - remote: buf.build/connectrpc/go
    out: gen/go
    opt:
      - paths=source_relative
  # TypeScript message types
  - remote: buf.build/bufbuild/es
    out: gen/ts
    opt:
      - target=ts
      - import_extension=js
  # TypeScript Connect-RPC clients
  - remote: buf.build/connectrpc/es
    out: gen/ts
    opt:
      - target=ts
      - import_extension=js
  # Python message types
  - remote: buf.build/protocolbuffers/python
    out: gen/python
inputs:
  - directory: v1
