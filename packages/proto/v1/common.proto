// Shared types used across VettGuard services.
syntax = "proto3";

package vettguard.v1;

option go_package = "github.com/vettguard/vettguard/packages/proto/gen/go/v1;protov1";

// TenantContext travels in every request via interceptors / metadata.
// Internal gRPC callers fill it from JWT claims; gateway populates from session.
message TenantContext {
  string tenant_id  = 1;
  string user_id    = 2;
  string request_id = 3;
  string trace_id   = 4;
}

// PageRequest is the canonical cursor-based pagination input.
message PageRequest {
  string cursor    = 1;
  int32  page_size = 2;  // default 50, max 200
}

message PageResponse {
  string next_cursor = 1;
  int32  total       = 2;  // -1 when unknown / too expensive to compute
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER       = 1;
  ROLE_ADMIN       = 2;
  ROLE_DISPATCHER  = 3;
  ROLE_VIEWER      = 4;
}
