// ELD service: Motive + Samsara adapters. Foundation phase has token exchange only.
syntax = "proto3";

package vettguard.v1;

import "common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vettguard/vettguard/packages/proto/gen/go;protov1";

service ELD {
  rpc StartOAuth    (StartELDOAuthRequest)    returns (StartELDOAuthResponse);
  rpc CompleteOAuth (CompleteELDOAuthRequest) returns (CompleteELDOAuthResponse);
  rpc ListConnections (ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc HandleWebhook (ELDWebhookEvent)         returns (ELDWebhookAck);
}

enum ELDProvider {
  ELD_PROVIDER_UNSPECIFIED = 0;
  ELD_PROVIDER_MOTIVE      = 1;
  ELD_PROVIDER_SAMSARA     = 2;
}

message ELDConnection {
  string      id           = 1;
  string      tenant_id    = 2;
  ELDProvider provider     = 3;
  string      external_id  = 4;
  bool        active       = 5;
  google.protobuf.Timestamp connected_at = 6;
}

message StartELDOAuthRequest  { string tenant_id = 1; ELDProvider provider = 2; string redirect_uri = 3; }
message StartELDOAuthResponse { string authorize_url = 1; string state = 2; }

message CompleteELDOAuthRequest  { string tenant_id = 1; ELDProvider provider = 2; string code = 3; string state = 4; }
message CompleteELDOAuthResponse { ELDConnection connection = 1; }

message ListConnectionsRequest  { string tenant_id = 1; }
message ListConnectionsResponse { repeated ELDConnection connections = 1; }

message ELDWebhookEvent { ELDProvider provider = 1; string signature = 2; bytes payload = 3; }
message ELDWebhookAck   { bool processed = 1; }
