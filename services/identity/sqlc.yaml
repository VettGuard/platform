version: "2"
sql:
  - engine: postgresql
    queries: internal/db/queries.sql
    schema: migrations/00001_initial_schema.sql
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: false
        emit_interface: true
        emit_pointers_for_null_types: false
        emit_prepared_queries: false
        rename:
          totp: TOTP
          mfa: MFA
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "citext"
            go_type: "string"
          - db_type: "inet"
            go_type:
              import: "net/netip"
              type: "Addr"
              pointer: true
